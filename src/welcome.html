<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<style>
  :root {
    color-scheme: light dark;
    --surface: light-dark(#ffffff, #161a22); --ink: light-dark(#111827, #eef1f4); --ink-2: light-dark(#4b5563, #a5aeb8);
    --rule: light-dark(#e2e5ea, #2a303a); --accent: light-dark(#2563eb, #7aa7f7);
    --glass: light-dark(rgb(255 255 255 / .78), rgb(22 26 34 / .72));
    --note: light-dark(rgb(255 255 255 / .7), rgb(255 255 255 / .06));
    --shadow: 0 0 0 1px light-dark(rgb(17 24 39 / .06), rgb(255 255 255 / .12)), 0 2px 4px light-dark(rgb(17 24 39 / .05), transparent),
      0 24px 44px -18px light-dark(rgb(30 27 75 / .42), rgb(0 0 0 / .9));
  }
  * { box-sizing: border-box; }
  html { background: #c98a7a url("photos/sunset.webp") center / cover no-repeat fixed; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  main {
    display: grid; justify-items: center; gap: 16px; width: min(100%, 560px); padding: 36px 32px 32px; border-radius: 24px;
    text-align: center; background: var(--glass); backdrop-filter: blur(24px) saturate(1.5); box-shadow: var(--shadow);
  }
  img { width: 56px; height: 56px; }
  h1 { margin: 0; font-size: 26px; font-weight: 650; letter-spacing: -.02em; text-wrap: balance; }
  p { margin: 0; color: var(--ink-2); text-wrap: pretty; }
  section { width: 100%; padding: 14px 18px; border-radius: 14px; background: var(--note); border: 1px solid var(--rule); text-align: start; }
  section h2 { margin: 0 0 4px; font-size: 15px; font-weight: 650; color: var(--ink); }
  section p { font-size: 14px; }
  section[hidden] { display: none; }
  button {
    font: inherit; font-size: 15px; font-weight: 600; padding: 11px 22px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--ink); color: var(--surface); transition: filter .15s;
  }
  button:hover { filter: brightness(1.25); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 480px) { main { padding: 28px 20px 24px; } h1 { font-size: 22px; } }
</style>
</head>
<body>
<main>
  <img src="icons/128.png" alt="">
  <h1 data-i18n="installedTitle"></h1>
  <p id="installed-text"></p>
  <section>
    <h2 data-i18n="installedAskTitle"></h2>
    <p data-i18n="installedAskText"></p>
  </section>
  <button id="open" type="button" data-i18n="openNewTab"></button>
  <section id="private" hidden>
    <h2 data-i18n="installedPrivateTitle"></h2>
    <p data-i18n="installedPrivateText"></p>
  </section>
</main>
<script type="module" src="welcome.js"></script>
</body>
</html>
