<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer"><!-- icons and thumbnails asked of other sites don't name this page -->
<title data-i18n="tabTitle"></title>
<link rel="stylesheet" href="newtab.css">
<script type="module" src="newtab.js"></script>
</head>
<body>
<script src="paint.js"></script>
<svg hidden>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-sort" viewBox="0 0 24 24"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 15v4M17 17h4"/></symbol>
  <symbol id="i-settings" viewBox="0 0 24 24"><path d="M20 7h-9M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></symbol>
  <symbol id="i-edit" viewBox="0 0 24 24"><path d="M4 20h4L19.5 8.5a2.8 2.8 0 0 0-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></symbol>
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M12 15V3M7 10l5 5 5-5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 3v12M17 8l-5-5-5 5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
  <symbol id="i-team" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.2a6.5 6.5 0 0 1 3 5.8"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"/></symbol>
</svg>

<header class="bar wrap">
  <div class="group-bar">
    <nav id="groups" class="groups" data-i18n-aria="groups"></nav>
    <button id="add-group" class="icon-btn" data-i18n-title="newGroup" data-i18n-aria="newGroup"><svg class="i" aria-hidden="true"><use href="#i-plus"/></svg></button>
    <button id="sort-group" class="icon-btn" data-i18n-title="sortGroup" data-i18n-aria="sortGroup" hidden><svg class="i" aria-hidden="true"><use href="#i-sort"/></svg></button>
  </div>
  <button id="open-settings" class="icon-btn" data-i18n-title="settings" data-i18n-aria="settings"><svg class="i" aria-hidden="true"><use href="#i-settings"/></svg></button>
</header>

<main class="wrap">
  <div class="hero">
    <p id="clock" class="clock"></p>
    <p id="date" class="date"></p>
    <form id="search-box" class="search" role="search">
      <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder" autocomplete="off" spellcheck="false">
    </form>
  </div>
  <p id="team-note" class="team-note" hidden></p>
  <ol id="grid" class="grid" data-i18n-aria="speedDials"></ol>
</main>

<aside id="rate" class="tip" popover="manual" data-i18n-aria="rateTabdial">
  <p data-i18n="ratePrompt"></p>
  <a id="rate-link" class="btn" target="_blank" data-i18n="rateTabdial"></a>
  <button type="button" class="icon-btn" popovertarget="rate" popovertargetaction="hide" data-i18n-title="close" data-i18n-aria="close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
</aside>

<aside id="jump-tip" class="tip" popover="manual" data-i18n-aria="jump">
  <p data-i18n="jumpHint"></p>
  <button type="button" class="icon-btn" popovertarget="jump-tip" popovertargetaction="hide" data-i18n-title="close" data-i18n-aria="close"><svg class="i" aria-hidden="true"><use href="#i-close"/></svg></button>
</aside>

<div id="group-menu" class="menu" popover="manual">
  <button type="button" id="menu-rename" data-i18n="renameGroup"></button>
  <button type="button" id="menu-delete" class="danger" data-i18n="deleteGroup"></button>
  <button type="button" id="menu-left" data-i18n="moveLeft"></button>
  <button type="button" id="menu-right" data-i18n="moveRight"></button>
  <div id="menu-teams" class="menu-more"></div>
</div>

<dialog id="dial-dialog" closedby="any" aria-labelledby="dial-heading">
  <form method="dialog" id="dial-form">
    <h2 id="dial-heading"></h2>
    <label class="field"><span data-i18n="address"></span><input name="url" type="text" required placeholder="example.com" autocomplete="off"></label>
    <label class="field"><span data-i18n="title"></span><input name="title" type="text" data-i18n-placeholder="optional" autocomplete="off"></label>
    <fieldset class="field">
      <legend data-i18n="thumbnail"></legend>
      <div class="thumb-row">
        <div id="dial-preview" class="thumb preview"></div>
        <div class="thumb-actions">
          <label class="btn secondary file-btn"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="uploadImage"></span><input name="imageFile" type="file" accept="image/*" class="vh"></label>
          <input name="imageUrl" type="url" data-i18n-placeholder="pasteImageLink" data-i18n-aria="imageLink">
          <button type="button" id="clear-image" class="link-btn" data-i18n="removeImage"></button>
        </div>
      </div>
    </fieldset>
    <label class="field"><span data-i18n="group"></span><select name="group"></select></label>
    <label class="field"><span data-i18n="folder"></span><select name="folder"></select></label>
    <div class="actions">
      <button type="button" id="delete-dial" class="btn danger" data-i18n="delete"></button>
      <span class="spacer"></span>
      <button type="button" class="btn secondary" data-close data-i18n="cancel"></button>
      <button value="save" class="btn" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<dialog id="folder-dialog" closedby="any" data-i18n-aria="folder">
  <input id="folder-name" type="text" data-i18n-aria="folderName" autocomplete="off">
  <ol id="folder-grid" class="grid" tabindex="-1" autofocus></ol>
</dialog>

<dialog id="group-dialog" closedby="any" aria-labelledby="group-heading">
  <form method="dialog" id="group-form">
    <h2 id="group-heading"></h2>
    <label class="field"><span data-i18n="name"></span><input name="name" type="text" required autocomplete="off"></label>
    <label class="field" id="group-team"><span data-i18n="groupFor"></span><select name="team"></select></label>
    <div class="actions">
      <button type="button" id="delete-group" class="btn danger" data-i18n="deleteGroup"></button>
      <span class="spacer"></span>
      <button type="button" class="btn secondary" data-close data-i18n="cancel"></button>
      <button value="save" class="btn" data-i18n="save"></button>
    </div>
  </form>
</dialog>

<dialog id="join-dialog" closedby="any" aria-labelledby="join-heading">
  <form method="dialog" id="join-form">
    <h2 id="join-heading"></h2>
    <p class="hint" data-i18n="joinHint"></p>
    <label class="field"><span data-i18n="yourName"></span><input name="name" type="text" required autocomplete="name"></label>
    <p class="hint" data-i18n="yourNameHint"></p>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" class="btn secondary" data-close data-i18n="cancel"></button>
      <button value="join" class="btn" data-i18n="joinTeam"></button>
    </div>
  </form>
</dialog>

<dialog id="sort-dialog" closedby="any" aria-labelledby="sort-heading">
  <form method="dialog">
    <h2 id="sort-heading"></h2>
    <p id="sort-text" class="hint" aria-live="polite"></p>
    <ul id="sort-moves" class="moves"></ul>
    <div class="actions">
      <span class="spacer"></span>
      <button type="button" id="sort-cancel" class="btn secondary" data-close></button>
      <button type="button" id="sort-go" class="btn"></button>
    </div>
  </form>
</dialog>

<dialog id="settings-dialog" class="wide" closedby="any" aria-labelledby="settings-heading">
  <form method="dialog">
    <h2 id="settings-heading" data-i18n="settings"></h2>
    <div id="settings-tabs" class="tabs" role="radiogroup" aria-labelledby="settings-heading">
      <label><input type="radio" name="tab" value="look" class="vh"><span data-i18n="appearance"></span></label>
      <label><input type="radio" name="tab" value="sync" class="vh"><span data-i18n="sync"></span></label>
      <label><input type="radio" name="tab" value="jump" class="vh"><span data-i18n="jump"></span></label>
      <label><input type="radio" name="tab" value="backups" class="vh"><span data-i18n="backups"></span></label>
      <label><input type="radio" name="tab" value="teams" class="vh"><span data-i18n="teams"></span></label>
      <label><input type="radio" name="tab" value="data" class="vh"><span data-i18n="yourData"></span></label>
      <label hidden><input type="radio" name="tab" value="unlock" class="vh"><span data-i18n="unlock"></span></label>
    </div>
    <section class="section" data-tab="look">
      <h3 data-i18n="background"></h3>
      <div class="swatches">
        <button type="button" class="swatch" data-bg="" data-i18n-title="bgDefault" data-i18n-aria="bgDefault"></button>
        <button type="button" class="swatch" data-bg="linear-gradient(135deg, #e0e7ff, #fce7f3)" data-i18n-title="bgLavender" data-i18n-aria="bgLavender"></button>
        <button type="button" class="swatch" data-bg="linear-gradient(135deg, #d1fae5, #dbeafe)" data-i18n-title="bgMint" data-i18n-aria="bgMint"></button>
        <button type="button" class="swatch" data-bg="linear-gradient(135deg, #fef3c7, #fbcfe8)" data-i18n-title="bgPeach" data-i18n-aria="bgPeach"></button>
        <button type="button" class="swatch" data-bg="linear-gradient(135deg, #1e3a8a, #0f766e)" data-i18n-title="bgOcean" data-i18n-aria="bgOcean"></button>
        <button type="button" class="swatch" data-bg="linear-gradient(160deg, #1f2937, #0b0f14)" data-i18n-title="bgNight" data-i18n-aria="bgNight"></button>
        <label class="swatch custom" data-i18n-title="pickColor"><input id="bg-color" type="color" data-i18n-aria="backgroundColor"></label>
        <label class="swatch upload" data-i18n-title="uploadBackground"><svg class="i" aria-hidden="true"><use href="#i-image"/></svg><input id="bg-file" type="file" accept="image/*" class="vh" data-i18n-aria="uploadBackground"></label>
      </div>
      <!-- Photos from Unsplash (docs/photos.md). data-tone: whether the clock goes dark (light) or light (dark) on it. -->
      <div class="swatches">
        <button type="button" class="swatch" data-bg="photos/lake.webp" data-tone="dark" data-i18n-title="bgLake" data-i18n-aria="bgLake"></button>
        <button type="button" class="swatch" data-bg="photos/sea.webp" data-tone="light" data-i18n-title="bgSea" data-i18n-aria="bgSea"></button>
        <button type="button" class="swatch" data-bg="photos/fog.webp" data-tone="light" data-i18n-title="bgFog" data-i18n-aria="bgFog"></button>
        <button type="button" class="swatch" data-bg="photos/sunset.webp" data-tone="light" data-i18n-title="bgSunset" data-i18n-aria="bgSunset"></button>
        <button type="button" class="swatch" data-bg="photos/forest.webp" data-tone="dark" data-i18n-title="bgForest" data-i18n-aria="bgForest"></button>
        <button type="button" class="swatch" data-bg="photos/dunes.webp" data-tone="dark" data-i18n-title="bgDunes" data-i18n-aria="bgDunes"></button>
        <button type="button" class="swatch" data-bg="photos/aurora.webp" data-tone="dark" data-i18n-title="bgAurora" data-i18n-aria="bgAurora"></button>
        <button type="button" class="swatch" data-bg="photos/stars.webp" data-tone="dark" data-i18n-title="bgStars" data-i18n-aria="bgStars"></button>
      </div>
      <label class="range">
        <span class="range-head"><span data-i18n="dialsPerRow"></span><output id="columns-out"></output></span>
        <input id="columns" type="range" min="3" max="12">
      </label>
      <label class="check"><input id="search-on" type="checkbox"><span data-i18n="showSearchBox"></span></label>
    </section>
    <section class="section" data-tab="sync">
      <label class="check"><input id="sync-on" type="checkbox"><span data-i18n="syncLabel"></span></label>
      <div id="code-off" class="codes">
        <p class="hint" data-i18n="syncHint"></p>
        <p class="hint" data-i18n="syncCodeHint"></p>
        <div class="row"><button type="button" id="code-new" class="btn secondary" data-i18n="syncCodeNew"></button></div>
        <p class="hint" data-i18n="syncCodeHave"></p>
        <div class="row">
          <input id="code-input" type="text" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" data-i18n-aria="syncCode" autocomplete="off" spellcheck="false">
          <button type="button" id="code-use" class="btn secondary" data-i18n="syncCodeUse"></button>
        </div>
      </div>
      <div id="code-on" class="codes" hidden>
        <p class="hint" data-i18n="syncCodeOnHint"></p>
        <div class="row">
          <input id="code-shown" type="text" readonly data-i18n-aria="syncCode">
          <button type="button" id="code-copy" class="btn secondary" data-i18n="copyCode"></button>
          <button type="button" id="code-link" class="btn secondary" data-i18n="copyLink"></button>
        </div>
        <div class="row">
          <button type="button" id="code-stop" class="btn secondary" data-i18n="syncStopHere"></button>
          <button type="button" id="code-stop-all" class="btn danger" data-i18n="syncStopAll"></button>
        </div>
      </div>
      <p id="sync-status" class="status" role="status"></p>
    </section>
    <section class="section" data-tab="jump">
      <p class="hint" data-i18n="jumpHint"></p>
      <label class="check"><input id="jump-history" type="checkbox"><span data-i18n="jumpHistory"></span></label>
      <p class="hint" data-i18n="jumpHistoryHint"></p>
    </section>
    <section class="section" data-tab="backups">
      <p id="backups-hint" class="hint"></p>
      <ul id="backups" class="backups"></ul>
      <div id="drive-box" class="plus">
        <p><b data-i18n="driveBackup"></b></p>
        <p id="drive-status" class="hint"></p>
        <div class="row">
          <button type="button" id="drive-connect" class="btn"></button>
          <button type="button" id="drive-now" class="btn secondary" data-i18n="driveNow"></button>
          <button type="button" id="drive-restore" class="btn secondary" data-i18n="driveRestore"></button>
          <button type="button" id="drive-disconnect" class="btn danger" data-i18n="driveDisconnect"></button>
        </div>
      </div>
      <p id="backup-status" class="status" role="status"></p>
    </section>
    <section class="section" data-tab="teams">
      <p class="hint" data-i18n="teamsHint"></p>
      <ul id="team-list" class="teams"></ul>
      <div class="row">
        <input id="invite-link" type="text" placeholder="https://nexuscortex.dev/tabdial/join/#…" data-i18n-aria="inviteLink" autocomplete="off" spellcheck="false">
        <button type="button" id="invite-join" class="btn secondary" data-i18n="joinTeam"></button>
      </div>
      <details id="team-new">
        <summary data-i18n="createTeam"></summary>
        <p id="team-new-hint" class="hint"></p>
        <div class="row">
          <input id="team-name" type="text" data-i18n-placeholder="teamName" data-i18n-aria="teamName" autocomplete="off">
          <input id="team-me" type="text" data-i18n-placeholder="yourName" data-i18n-aria="yourName" autocomplete="name">
          <button type="button" id="team-create" class="btn" data-i18n="create"></button>
        </div>
      </details>
      <p id="team-status" class="status" role="status"></p>
    </section>
    <section class="section" data-tab="data">
      <p class="hint" data-i18n="yourDataHint"></p>
      <div class="row">
        <button type="button" id="export" class="btn secondary"><svg class="i" aria-hidden="true"><use href="#i-download"/></svg><span data-i18n="export"></span></button>
        <label class="btn secondary file-btn"><svg class="i" aria-hidden="true"><use href="#i-upload"/></svg><span data-i18n="importFile"></span><input id="import-file" type="file" class="vh"></label>
        <button type="button" class="btn secondary add-top-sites" data-i18n="addMostVisited"></button>
      </div>
      <p class="hint" data-i18n="importFormatsHint"></p>
      <p class="hint"><span data-i18n="guides"></span> <a data-web="switch/speed-dial-2/" target="_blank">Speed Dial 2</a> · <a data-web="switch/fvd/" target="_blank">FVD Speed Dial</a> · <a data-web="switch/group-speed-dial/" target="_blank">Group Speed Dial</a> · <a data-web="switch/speed-dial-net/" target="_blank">speed-dial.net</a></p>
      <details>
        <summary data-i18n="fvdPaste"></summary>
        <textarea id="import-text" rows="3" data-i18n-placeholder="pastedText" data-i18n-aria="pastedText"></textarea>
        <div class="row"><button type="button" id="import-paste" class="btn secondary" data-i18n="importPasted"></button></div>
      </details>
      <p id="import-status" class="status" role="status"></p>
    </section>
    <section class="section" data-tab="unlock">
      <div id="unlock-box" class="plus">
        <p><b data-i18n="unlockPitch"></b> <span data-i18n="unlockTerms"></span></p>
        <div class="row">
          <button type="button" id="unlock" class="btn" data-i18n="unlockFor"></button>
          <a class="hint" data-web="terms/" target="_blank" data-i18n="terms"></a>
        </div>
        <details>
          <summary data-i18n="alreadyPaid"></summary>
          <p class="hint" data-i18n="alreadyPaidHint"></p>
          <div class="row">
            <button type="button" id="account-signin" class="btn secondary" data-i18n="signInGoogle"></button>
          </div>
          <p class="hint" data-i18n="licenseHint"></p>
          <div class="row">
            <input id="license-key" type="text" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" data-i18n-aria="licenseKey" autocomplete="off" spellcheck="false">
            <button type="button" id="license-unlock" class="btn secondary" data-i18n="unlock"></button>
          </div>
        </details>
      </div>
      <p id="unlock-status" class="status" role="status"></p>
    </section>
    <div class="actions"><a class="hint" data-web="guide/" target="_blank" data-i18n="howToUse"></a><span class="spacer"></span><button value="close" class="btn" autofocus data-i18n="done"></button></div>
  </form>
</dialog>
<p id="error" class="error" role="alert" hidden></p>
</body>
</html>
