<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; --hover: light-dark(#f5f6f8, #1d222b); --ink-2: light-dark(#4b5563, #a5aeb8); --accent: light-dark(#2563eb, #7aa7f7); }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { margin: 0; padding: 8px; width: max-content; min-width: 200px; max-width: 320px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  p { margin: 4px 8px 8px; font-size: 12px; color: var(--ink-2); }
  p:empty { display: none; }
  button {
    display: block; width: 100%; padding: 8px; border: 0; border-radius: 8px; background: none; color: inherit; font: inherit;
    text-align: start; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  button:hover, button[aria-current] { background: var(--hover); }
  button[aria-current] { font-weight: 600; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
</style>
</head>
<body>
<p id="title"></p>
<div id="groups"></div>
<script type="module" src="popup.js"></script>
</body>
</html>
